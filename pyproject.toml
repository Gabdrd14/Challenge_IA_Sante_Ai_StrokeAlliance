[project]
name = "projet-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gabriel", email = "gabrieldurand2002@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "brkraw>=0.5.7",
    "brukerapi>=0.4.6",
    "monai>=1.6.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "plotly>=7.1.0",
    "pyside6>=6.12.0",
    "pytorch-lightning>=2.6.6",
    "roifile>=2026.2.10",
    "scipy>=1.17.1",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.20.0",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
]

[project.scripts]
projet-master = "projet_master:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
